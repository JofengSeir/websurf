# apps/debug — 独立 Cargo workspace 根（仓库根 workspace 不含本目录）
#
# 唯一成员 crates/wasm（包名 websurf-wasm，crate-type 出 cdylib + rlib）：debug 工程的
# wasm-bindgen 绑定层，导出 BSP 解析 / GLB 与碰撞体 / 传送点 / PVS 入口，编译到 WebAssembly。

[workspace]
members = ["crates/wasm"]
resolver = "2"

# crates/wasm 直接依赖 vmdl 0.2，本 workspace 用 [patch.crates-io] 把它换成仓库内副本
# src/vendor/vmdl（manifest 自报 name = "vmdl"、version = "0.2.0"）；该副本相对 crates.io
# vmdl-0.2.0 改写了 2 个文件：`src/vendor/vmdl/src/vtx/mod.rs` 的 `Strip::indices`（条带展开的
# 循环边界与索引公式）与 `src/vendor/vmdl/src/lib.rs` 的两处返回类型生命周期标注。
[patch.crates-io]
vmdl = { path = "../../src/vendor/vmdl" }

# ============================================================
# 性能优化配置（只为本 workspace 的构建生效：LTO + opt-level 3 + codegen-units 1）
# ============================================================
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
