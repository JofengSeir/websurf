# websurf — 单一 WASM crate
#
# 本 crate 是仓库根 Cargo workspace 的成员（D-133 收口：唯一 Cargo.lock / 唯一 target/）。
# 模块结构：本 crate 的唯一源文件是 apps/game/crates/wasm/src/lib.rs（wasm-bindgen 导出层：
# BSP 解析 / GLB 导出 / brush 平面导出等 JS 入口）；下列模块都在共享 crate websurf-wasm-core
# 内（仓库根 src/wasm-core/），本目录不含它们的副本：
# - src/wasm-core/vbsp/: BSP 文件解析模块（Leaves 另存一份按 cluster 排序的副本）
# - src/wasm-core/bsp_to_gltf_core/: GLB 导出核心
# - src/wasm-core/model_integrator/: 模型/静态道具集成
# - src/wasm-core/texture_utils/: 纹理解码（VTF → PNG）
# - src/wasm-core/pakfile_models.rs: PAKFILE 条目索引与 VMT 解析
# - src/wasm-core/phyfile.rs、src/wasm-core/vhv.rs、src/wasm-core/mosaic/: .phy 碰撞解析、prop 顶点光照、mosaic 与 MTZ 编解码

[package]
# 包名带端前缀：debug 与 game 的 wasm crate 收口前同名 websurf-wasm，无法共存于同一 workspace
# （D-133）。产物名不受包名影响：apps/game/package.json 的 build:wasm 用
# `wasm-pack --out-name websurf_wasm` 固定 pkg/ 与 web/ 的 websurf_wasm.* 文件名。
name = "websurf-game-wasm"
version = "0.1.0"
edition = "2021"
description = "WebSurf WASM 核心：BSP 解析、GLB 导出、brush 平面导出"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 三端共享 wasm-bindgen 导出层（本 crate 唯一直接依赖）：core/phys/glb-lite 覆盖
# BspProcessor 与 PhysWorld 全部导出；物理内核经本依赖的 phys feature 接入（不再直连 src/）。
websurf-wasm-bindings = { path = "../../../../src/wasm-bindings", features = ["core", "phys", "glb-lite"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os"]
