# WebSurf-viewer — 单一 WASM crate（薄导出层）
#
# 导出 BspProcessor 最小集（websurf-wasm-core 解析层）：
# metadata / parse_spawn_points / export_glb_with_pakfile_models。
# 不含 websurf-phys（无物理）、不含 mosaic/缺失纹理/默认纹理包（纯视觉查看器）。

[package]
name = "websurf-viewer-wasm"
version = "0.1.0"
edition = "2021"
description = "WebSurf-viewer WASM 薄导出层：BSP 解析 + GLB 导出最小集"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 共享解析层：仓库根 src/wasm-core/（crate websurf-wasm-core），解析与 GLB 装配都由它完成
websurf-wasm-core = { path = "../../../../src/wasm-core" }

# WASM 绑定：本工程锁到 wasm-bindgen 0.2.128（apps/viewer/Cargo.lock），
# wasm-bindgen-cli 由 src/scripts/install-wasm-bindgen.cmd 按同一版本安装。
wasm-bindgen = "0.2"

# JSON 与 GLB 序列化：serde / serde_json 用在 BspMetadata 与出生点报告（apps/viewer/crates/wasm/src/lib.rs）；
# gltf 在该文件内无直接引用 —— GLB 字节由共享层 bsp_to_gltf_core 产出。
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gltf = "1.4.1"

# PAKFILE 模型解析：vmdl 的 Mdl::read 是 resolve_pakfile_materials 的纹理名表来源（本 crate 无 load_vmdl）
vmdl = "0.2"

# VTF → PNG 解码（GLB 材质贴图）：decode_vtf_to_png 走共享层 texture_utils，
# image 在 apps/viewer/crates/wasm/src/lib.rs 里只用到 image::ImageFormat::Png（此处也只开 png feature）。
image = { version = "0.25", default-features = false, features = ["png"] }

# wasm-pack 的 release profile：由下面的 wasm-opt = false 关掉 wasm-opt 二次优化；
# 优化档位由本工程 workspace 根的 [profile.release] 给（apps/viewer/Cargo.toml：
# opt-level = 3 + lto = true + codegen-units = 1），构建入口是 npm run build:wasm。
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
