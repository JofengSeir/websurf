# WebSurf-viewer — 单一 WASM crate（薄导出层）
#
# 本 crate 是仓库根 Cargo workspace 的成员（D-133 收口：唯一 Cargo.lock / 唯一 target/）。
# 包名 websurf-viewer-wasm 的默认 wasm-pack 产物名已是 websurf_viewer_wasm.*，
# 故 package.json 不需要 --out-name。
#
# 导出 BspProcessor 最小集（websurf-wasm-core 解析层）：
# metadata / parse_spawn_points / export_glb_with_pakfile_models。
# 不含 websurf-phys（无物理）、不含 mosaic/缺失纹理/默认纹理包（纯视觉查看器）。

[package]
name = "websurf-viewer-wasm"
version = "0.1.0"
edition = "2021"
description = "WebSurf-viewer WASM 薄导出层：BSP 解析 + GLB 导出最小集"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 三端共享 wasm-bindgen 导出层（本 crate 唯一直接依赖）：core/viewer-export 覆盖
# BspProcessor 最小集；viewer 不含物理，故不启 phys feature。
websurf-wasm-bindings = { path = "../../../../src/wasm-bindings", features = ["core", "viewer-export"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
