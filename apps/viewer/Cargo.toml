# apps/viewer — 独立 Cargo workspace 根（仓库根 workspace 不含本目录）
#
# 唯一成员 crates/wasm（包名 websurf-viewer-wasm）：薄导出层，只依赖共享解析层
# websurf-wasm-core，不含 websurf-phys，不导出 brush / 传送点 / PVS / mosaic / 默认纹理包。
# 导出面只有 BspProcessor 的 new / metadata / parse_spawn_points / export_glb_with_pakfile_models。

[workspace]
members = ["crates/wasm"]
resolver = "2"

# 与 apps/debug、apps/game 同款 [patch.crates-io]：把 crates/wasm 依赖的 vmdl 0.2 换成仓库内副本
# `src/vendor/vmdl`（相对 crates.io vmdl-0.2.0 改写了 2 个文件：`src/vendor/vmdl/src/vtx/mod.rs`
# 的 `Strip::indices` 与 `src/vendor/vmdl/src/lib.rs` 的两处返回类型生命周期标注）。
[patch.crates-io]
vmdl = { path = "../../src/vendor/vmdl" }

# ============================================================
# 性能优化配置（只为本 workspace 的构建生效：LTO + opt-level 3 + codegen-units 1）
# ============================================================
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
