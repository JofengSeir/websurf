# websurf-wasm-core — 共享 WASM 解析/导出核心（debug/ 与 game/ 共用）
#
# 模块来源：debug/ 与 game/ 的 crates/wasm（解析层已统一合并到此，
# 两端 lib.rs 仅保留 wasm-bindgen 导出层与各自特色函数）。
#
# 独立 workspace root（不归属 debug/ 或 game/ 的 workspace，
# 两工程经 path 依赖引用；websurf-phys 同模式）。
[workspace]

[package]
name = "websurf-wasm-core"
version = "0.1.0"
edition = "2021"
description = "WebSurf 共享 WASM 核心：BSP 解析、GLB 导出、模型/纹理解析（不含 wasm-bindgen 导出层）"
license = "MIT"

[lib]
crate-type = ["rlib"]
path = "lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 模型解析（model-integrator / pakfile-models 共用）
vmdl = "0.2"
vtf = "0.3"
vmt-parser = "0.2"
tf-asset-loader = { version = "0.1.7", features = ["zip"] }

# GLB 导出（bsp-to-gltf-core）
gltf = "1.4.1"
gltf-json = { version = "1.4.1", features = ["KHR_texture_transform", "extras"] }
cgmath = "0.18.0"
bytemuck = { version = "1.17.1", features = ["derive"] }
miette = "7.2.0"

# BSP 解析（vbsp/ 模块依赖）
arrayvec = "0.7.6"
binrw = "0.14.0"
bitflags = "2.6.0"
bv = "0.11.1"
itertools = "0.13.0"
lzma-rs = "0.3.0"
num_enum = "0.7.2"
static_assertions = "1.1.0"
thiserror = "2.0.11"
vdf-reader = "0.2.0"
zip = { version = "0.6.3", package = "zip-lzma", features = ["lzma"], default-features = false }

# 纹理解码（texture-utils）
byteorder = "1.5.0"
texpresso = "2.0.2"
parse-display = "0.9.0"

# image 库：仅启用 png 编解码器（WASM 下减小体积）
image = { version = "0.25", default-features = false, features = ["png"] }

# WASM 下的 getrandom 需要 js feature（0.2 用于直接依赖，0.3 用于 ahash 间接依赖）
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

# path-dedot 在 wasm32 下需要 use_unix_paths_on_wasm feature 才能编译 unix 模块
# （被 tf-asset-loader 间接拉入但未启用此 feature）
path-dedot = { version = "3", features = ["use_unix_paths_on_wasm"] }

# ahash 在 WASM 下需要禁用 runtime-rng（无 /dev/urandom）
[dependencies.ahash]
version = "0.8"
default-features = false
features = ["compile-time-rng"]
