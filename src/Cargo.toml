[package]
name = "websurf-phys"
version = "0.1.0"
edition = "2021"
description = "WebSurf 共享物理系统（源自 game/ WebSurf-game 的 Rust 物理，被 debug/ 与 game/ 两工程共同引用）"
license = "MIT"

# 归属仓库根 Cargo workspace（仓库根 Cargo.toml 的 [workspace] members）：本 crate 与
# websurf-wasm-core、websurf-wasm-bindings 以及三端 wasm crate（apps/{debug,game,viewer}/crates/wasm）
# 同为成员，共用仓库根 Cargo.lock 与仓库根 target/。D-133 收口前三端各自是一门独立 workspace。

[lib]
crate-type = ["rlib"]
path = "lib.rs"

[features]
default = []
# 仅 debug 宿主使用：打开后 `src/phys/mod.rs` 末尾那个 `#[cfg(feature = "phys-debug")] impl`
# 里的 12 个诊断/种子面导出才存在（set_state_ex / state_full_json / gate_veto_count 与
# debug_trace / debug_position_probe / debug_collide_attrib / debug_tri_mesh_name /
# debug_stuck_probe / debug_hull_stats / debug_hull / debug_free_table / debug_normal_escape）。
# apps/debug 经 `websurf-wasm-bindings` 的 `debug-tools` 打开；apps/game / apps/viewer 不开，
# 产物里因此没有这 12 个导出（`debug_line_trace` 不在其中，无条件保留）。
phys-debug = []

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip：f64 的 parse↔print 位级精确往返。种子面（src/phys/seed.rs 的
# set_state_ex / state_full_json）按 JSON 文本传递整实例状态，数值一致靠该 feature。
serde_json = { version = "1.0", features = ["float_roundtrip"] }
