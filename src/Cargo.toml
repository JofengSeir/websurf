[package]
name = "websurf-phys"
version = "0.1.0"
edition = "2021"
description = "WebSurf 共享物理系统（源自 game/ WebSurf-game 的 Rust 物理，被 debug/ 与 game/ 两工程共同引用）"
license = "MIT"

# 归属仓库根 Cargo workspace（与 websurf-wasm-core、四个模块 wasm crate 同 workspace，
# 共享根 Cargo.lock；target/ 位于各工程本地；曾为独立 workspace root，2026-09-06 合并）。

[lib]
crate-type = ["rlib"]
path = "lib.rs"

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
# t3: float_roundtrip = parse↔print 位级精确往返（种子面 JSON 通道的位级契约前提；
# 默认 fast parser 对部分 f64 有 1-ULP 往返偏差，实测 origin[2] 10.478655362066775 → …776）
serde_json = { version = "1.0", features = ["float_roundtrip"] }
