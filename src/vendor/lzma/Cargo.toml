# 空 [workspace] 表：本副本只作为 [patch.crates-io] 的路径替换被引用，不并入任何上层
# workspace（vmdl 副本同款）；缺了它 `cargo check --manifest-path` 会被仓库根 workspace
# 认领而报 "believes it's in a workspace when it's not"。
[workspace]

[package]
name    = "lzma"
version = "0.2.2"
edition = "2015"

authors = ["meh. <meh@schizofreni.co>"]
license = "WTFPL"

description = "LZMA format handling."
repository  = "https://github.com/meh/rust-lzma"
keywords    = ["lzma", "compression", "decompression"]

[dependencies]
byteorder = "0.5"
