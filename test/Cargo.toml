# WebSurf-test — Rust workspace 根
#
# 单一 WASM crate（crates/wasm），薄导出层：re-export 共享物理系统
# （仓库根 src/，websurf-phys）的 PhysWorld + 共享解析层（websurf-wasm-core：
# BSP/模型碰撞/GLB/PAKFILE 纹理——BspProcessor 最小导出集，无 mosaic/默认包）。
# 时序验证用手工 brush 世界与真实 BSP 地图（surf_666），聚焦
# "输入→双模物理→帧信号渲染"共享内存时序。

[workspace]
members = ["crates/wasm"]
resolver = "2"

# 与 game/ 同款 [patch.crates-io]（vmdl vendor 到共享目录 src/vendor/vmdl）；
# 本工程经 wasm-core 间接依赖 vmdl（crates/wasm 内 load_vmdl 直接使用）。
[patch.crates-io]
vmdl = { path = "../src/vendor/vmdl" }

# ============================================================
# 性能优化配置（WASM 构建需启用 LTO + 优化）
# ============================================================
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
