<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>bsp-extract — BSP 导入导出</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    font-size: 13px; color: #e8e8e8; background: #0f1115;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: 520px; max-width: 94vw; padding: 24px 26px;
    background: rgba(21,24,30,0.92); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px; backdrop-filter: blur(10px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  h1 { font-size: 16px; font-weight: 600; color: #e2e8f0; margin-bottom: 4px; }
  .sub { font-size: 12px; color: #9aa3b2; margin-bottom: 18px; }
  #drop {
    border: 1.5px dashed rgba(255,255,255,0.22); border-radius: 10px;
    padding: 28px 16px; text-align: center; color: #9aa3b2;
    cursor: pointer; transition: all 0.15s; margin-bottom: 14px;
  }
  #drop:hover, #drop.drag { border-color: rgba(94,129,244,0.8); background: rgba(94,129,244,0.06); color: #c8ccd4; }
  #drop b { color: #c8ccd4; }
  #meta {
    display: none; background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px; font-size: 12px;
    line-height: 1.8; color: #b6bdc9; font-variant-numeric: tabular-nums;
  }
  #meta .k { color: #7d8797; }
  #actions { display: none; gap: 10px; }
  button {
    flex: 1; font-size: 13px; color: #fff; padding: 10px 0;
    background: #3d5ce8; border: none; border-radius: 8px; cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #4a68f0; }
  button:disabled { background: #2a2f3a; color: #7d8797; cursor: not-allowed; }
  #err { display: none; color: #f08a8a; font-size: 12px; margin-top: 10px; word-break: break-all; }
  input[type="file"] { display: none; }
</style>
</head>
<body>
<div class="card">
  <h1>bsp-extract</h1>
  <div class="sub">Source 1 (CS:GO) BSP → GLB 导入导出 · 最小实现</div>

  <div id="drop">将 <b>.bsp</b> 文件拖到这里,或点击选择</div>
  <input type="file" id="file" accept=".bsp" />

  <div id="meta"></div>

  <div id="actions">
    <button id="export" disabled>导出 GLB</button>
  </div>
  <div id="err"></div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
