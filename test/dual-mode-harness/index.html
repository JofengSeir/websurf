<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebSurf-test — 双模物理 + 帧信号渲染</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      font-size: 13px; color: #e8e8e8; background: #0f1115;
    }
    #app { position: fixed; inset: 0; }
    #game {
      display: block; width: 100%; height: 100%;
      background: #0f1115; cursor: crosshair;
    }
    #hud {
      position: absolute; top: 14px; left: 14px; z-index: 5;
      padding: 10px 14px; border-radius: 10px;
      background: rgba(15,17,21,0.78); border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(8px); line-height: 1.9;
      pointer-events: none; user-select: none;
    }
    #hud .title { font-size: 14px; font-weight: 600; color: #e2e8f0; }
    #hud kbd {
      font-family: inherit; font-size: 11px; color: #9aa3b2;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 4px; padding: 1px 5px; margin: 0 1px;
    }
    #hud .hint { font-size: 12px; color: #9aa3b2; }
    #difficulty {
      position: absolute; top: 14px; right: 14px; z-index: 5;
      display: flex; gap: 6px;
      padding: 8px 10px; border-radius: 10px;
      background: rgba(15,17,21,0.78); border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
    }
    #difficulty button {
      font-size: 12px; color: #c8ccd4; padding: 5px 12px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px; cursor: pointer; transition: all 0.15s;
    }
    #difficulty button:hover { background: rgba(255,255,255,0.12); }
    #difficulty button.active { border-color: rgba(94,129,244,0.7); color: #5e81f4; background: rgba(94,129,244,0.12); }
    #bspbar {
      position: absolute; top: 54px; right: 14px; z-index: 5;
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; border-radius: 10px;
      background: rgba(15,17,21,0.78); border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
    }
    #bspbar .filebtn {
      font-size: 12px; color: #c8ccd4; padding: 5px 12px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px; cursor: pointer; white-space: nowrap;
    }
    #bspbar .filebtn:hover { background: rgba(255,255,255,0.12); }
    #bspbar input[type="file"] { display: none; }
    #bspStatus { font-size: 12px; color: #9aa3b2; max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="title">WebSurf-test — 双模物理 + 帧信号渲染时序验证</div>
    <div class="hint">
      点击画布锁定鼠标；<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动，<kbd>空格</kbd> 跳跃，<kbd>R</kbd> 重生
    </div>
    <div class="hint" id="rateLabel">物理 Tick 率：64 Hz（默认）</div>
  </div>

  <!-- 难度手感调节：TICK_RATE → WorkerA 模式B 粗糙步长速度覆盖（1/TICK_RATE，只影响手感）；
       渲染恒平滑跟随 1ms 无限制物理状态。0 = 关闭难度修正（纯 1ms 无限制） -->
  <div id="difficulty">
    <button data-rate="0">关</button>
    <button data-rate="32">32</button>
    <button data-rate="64" class="active">64</button>
    <button data-rate="128">128</button>
    <button data-rate="256">256</button>
    <button data-rate="1000">1000</button>
  </div>

  <!-- BSP 地图加载：文件选择 → 主线程解析（BspProcessor）→ WorkerA 物理世界 + WorkerB GLB 渲染 -->
  <div id="bspbar">
    <label class="filebtn">加载 BSP 地图<input id="bspFile" type="file" accept=".bsp" /></label>
    <span id="bspStatus">未加载地图（BSP 为唯一玩法）</span>
  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
