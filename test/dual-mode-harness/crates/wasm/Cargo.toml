# WebSurf-test — 单一 WASM crate（薄导出层）
#
# 导出 PhysWorld（websurf-phys）+ BspProcessor 最小导出集（websurf-wasm-core 解析层）：
# 解析/GLB/模型碰撞等实现共享自仓库根 src/wasm-core/，本 crate 仅保留
# wasm-bindgen 导出层（与 game/crates/wasm 同模式，拷贝所需方法子集）。

[package]
name = "websurf-test-wasm"
version = "0.1.0"
edition = "2021"
description = "WebSurf-test WASM 薄导出层：PhysWorld + BspProcessor 最小导出集"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 共享物理系统（仓库根 src/，websurf-phys）
websurf-phys = { path = "../../../../src" }
# 共享解析层（仓库根 src/wasm-core/，websurf-wasm-core）
websurf-wasm-core = { path = "../../../../src/wasm-core" }

# WASM 绑定（与 websurf-phys 同一 wasm-bindgen 主版本，保证 glue 版本一致）
wasm-bindgen = "0.2"

# BSP 导出 JSON / GLB 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gltf = "1.4.1"

# PAKFILE 模型解析（load_vmdl）
vmdl = "0.2"

# VTF → PNG 解码（GLB 材质贴图；仅 png 编解码器，减小体积）
image = { version = "0.25", default-features = false, features = ["png"] }

# PVS 位图 Base64 编码（parse_pvs_data 导出）
base64 = "0.22"

# 本机 NODE_OPTIONS 含 --use-system-ca 会污染 wasm-opt（node 脚本）；LTO+opt3 已足够，跳过二次优化
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
