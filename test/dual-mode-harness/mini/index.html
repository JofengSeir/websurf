<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebSurf-mini — 核心链路最小实现</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      font-size: 13px; color: #e8e8e8; background: #0f1115;
    }
    #game {
      display: block; width: 100%; height: 100%;
      background: #0f1115; cursor: crosshair;
    }
    #hud {
      position: absolute; top: 14px; left: 14px; z-index: 5;
      padding: 10px 14px; border-radius: 10px;
      background: rgba(15,17,21,0.78); border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(8px); line-height: 1.9;
      pointer-events: none; user-select: none;
    }
    #hud .title { font-size: 14px; font-weight: 600; color: #e2e8f0; }
    #hud .hint { font-size: 12px; color: #9aa3b2; }
    #hud kbd {
      font-family: inherit; font-size: 11px; color: #9aa3b2;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 4px; padding: 1px 5px; margin: 0 1px;
    }
    #ratebar {
      position: absolute; top: 14px; right: 14px; z-index: 5;
      display: flex; gap: 6px;
      padding: 8px 10px; border-radius: 10px;
      background: rgba(15,17,21,0.78); border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
    }
    #ratebar button {
      font-size: 12px; color: #c8ccd4; padding: 5px 12px;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px; cursor: pointer; transition: all 0.15s;
    }
    #ratebar button:hover { background: rgba(255,255,255,0.12); }
    #ratebar button.active { border-color: rgba(94,129,244,0.7); color: #5e81f4; background: rgba(94,129,244,0.12); }
    #arch {
      position: absolute; bottom: 14px; left: 14px; z-index: 5;
      font-size: 11px; color: #6b7280; font-family: ui-monospace, Consolas, monospace;
      padding: 6px 10px; border-radius: 8px;
      background: rgba(15,17,21,0.6); border: 1px solid rgba(255,255,255,0.08);
      pointer-events: none;
    }
  </style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="title">WebSurf-mini — 核心链路最小实现</div>
  <div class="hint">
    点击锁定鼠标；<kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动，<kbd>空格</kbd> 跳跃，<kbd>R</kbd> 重生
  </div>
  <div class="hint" id="status">等待 WorkerA 物理首帧…</div>
</div>

<!-- tick 率（0=纯 1ms 无限制；32/64/128 模式B 难度） -->
<div id="ratebar">
  <button data-rate="0">关</button>
  <button data-rate="32">32</button>
  <button data-rate="64" class="active">64</button>
  <button data-rate="128">128</button>
  <button data-rate="1000">1000</button>
</div>

<div id="arch">main(输入+rAF帧信号) → SAB → WorkerA(1ms物理+tick) → SAB双缓冲 → WorkerB(插值渲染)</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
