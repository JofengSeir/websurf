# vmdl — vendored from crates.io vmdl-0.2.0 (MIT, https://github.com/icewind1991/vmdl)
#
# 本项目为修复 Source VTX 三角形条带展开算法而 vendor 本 crate：
# `Strip::indices()` 原实现奇数位公式错误（生成退化三角形）且循环多两次（末尾索引越界），
# 导致条带每隔一个三角形丢失、条带端点出现跨条带杂散面（模型边角"多四角面"）。
# 修复见 src/vtx/mod.rs::Strip::indices（公式 `[idx, idx+1+cw, idx+2-cw]` + `0..len-2`）。
#
# 通过两端工程 workspace 根 Cargo.toml 的 `[patch.crates-io] vmdl = { path = "../src/vendor/vmdl" }` 引用（共享单副本）。

[workspace]

[package]
edition = "2021"
rust-version = "1.70.0"
name = "vmdl"
version = "0.2.0"
description = "Rust parser for valve model files."
license = "MIT"
repository = "https://github.com/icewind1991/vmdl"

[lib]
name = "vmdl"
path = "src/lib.rs"

[dependencies]
arrayvec = "0.7.6"
bitflags = "2.6.0"
bytemuck = { version = "1.17.0", features = ["derive"] }
cgmath = "0.18.0"
half = "2.4.1"
itertools = "0.13.0"
num_enum = "0.7.3"
static_assertions = "1.1.0"
thiserror = "1.0.63"
tracing = "0.1.40"
