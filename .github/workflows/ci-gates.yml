# WebSurf: 测试门禁（不含部署）
#
# 结构：门禁与部署解耦——部署只构建/发布 apps（见 deploy-pages.yml 的 build job），门禁在 PR 与
# main 上独立跑；三个 app 的 Rust 编译各在自己的 job 内进行。
#
# 门禁清单（与各工程 package.json 的 test:* 对齐）：
#   rust-unit-tests — `cargo test -p websurf-phys`（共享层物理单测；含蹲姿/surf 回归、P2 幻影门）
#   debug           — test:optimize-scene / test:auth-clock / test:path-acceptance / test:jump-apex /
#                     test:surf-crouch（五道都在 apps/debug 内跑：optimize-scene 会把
#                     `src/renderer/renderer-main.ts` 及其 `../pkg/websurf_wasm.js` 打成 Node bundle，
#                     jump-apex 与 surf-crouch 直读 `apps/debug/pkg/` ⇒ 本 job 先建 debug wasm）
#   game            — test:phys / test:seed-smoke / test:surf-crouch（都读 apps/game/pkg）
#   viewer          — test:replay（纯 TS 自检，不依赖 pkg ⇒ 本 job 不建 wasm）
#
# 注：`debug:test:surf-crouch` 与 game 侧脚本逐字节相同；debug 的 pkg 本就要为 optimizeScene 门
# 构建，故顺带跑掉这一道，边际成本为零。

name: CI Gates

on:
  push:
    branches: [main]
    # 纯文档改动不跑门禁（文档由 Doc Drift Check 负责）
    paths-ignore:
      - 'documents/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'documents/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── 共享层 Rust 单测（不需要 wasm-pack，最便宜的一道）──────────────
  rust-unit-tests:
    name: rust unit tests (websurf-phys)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo test -p websurf-phys
        run: cargo test -p websurf-phys

  # ── debug 门禁（五道都在 apps/debug 内跑，先建本工程 pkg）─────────────────
  debug-gates:
    name: debug gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      # wasm-bindgen-cli：缓存 → 预编译包（秒级）→ cargo install（兜底）。
      # 与 deploy-pages.yml 用同一个 cache key，两个 workflow 互相命中。
      - name: Cache wasm-bindgen-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.128-x86_64-linux

      - name: Install wasm-bindgen-cli 0.2.128 (cache → prebuilt → cargo install)
        shell: bash
        run: |
          set -euo pipefail
          if [ -x "$HOME/.cargo/bin/wasm-bindgen" ] &&
             "$HOME/.cargo/bin/wasm-bindgen" --version 2>/dev/null | grep -q '0.2.128'; then
            echo "[cache hit] wasm-bindgen-cli 0.2.128 已就绪"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          VERSION=0.2.128
          if curl -fSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 30 \
               -o /tmp/wbg.tar.gz \
               "https://github.com/rustwasm/wasm-bindgen/releases/download/${VERSION}/wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl.tar.gz"; then
            tar -xzf /tmp/wbg.tar.gz -C /tmp
            mkdir -p "$HOME/.cargo/bin"
            cp "/tmp/wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" "$HOME/.cargo/bin/"
            echo "[prebuilt] wasm-bindgen-cli ${VERSION} 已就位"
          else
            echo "[warn] 预编译包下载失败，退回 cargo install（首次编译数分钟，之后走 cache）"
            cargo install wasm-bindgen-cli --version "${VERSION}" --locked
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install debug dependencies
        working-directory: apps/debug
        run: npm ci

      - name: Build debug WASM
        working-directory: apps/debug
        # debug 的门禁会把 `src/renderer/renderer-main.ts`（及其 `../pkg/websurf_wasm.js`）
        # 用 esbuild 打包成 Node bundle ⇒ **必须先有 pkg/**，否则 esbuild 直接报
        # "Could not resolve ../../pkg/websurf_wasm.js"（2026-09-21 实测）。
        run: npm run build:wasm

      # 渲染性能回归门：面片规模地图（surf_666 GLB = 34409 primitive）必须经 optimizeScene
      # 合并到 300~800 块（否则每帧 3.4 万次 draw call）。断言顶点守恒 + 块数区间。
      - name: Verify debug optimizeScene (GLB 空间分块合并)
        working-directory: apps/debug
        run: npm run test:optimize-scene

      # 权威时钟回归门：tickRate 配置消息不得丢仿真时间（旧行为会把 63.6 tick/s 打到 0.5）。
      - name: 权威时钟验证（配置消息不得丢仿真时间）
        working-directory: apps/debug
        run: npm run test:auth-clock

      # tick→渲染 路径垂距门：Worker 权威帧的发布位置必须是渲染轨迹上的采样点。
      # 夹具是「缺陷存在时」的真实录制，配 --expect fail —— 判别力自检。
      - name: tick→render 路径垂距验收（稳态 p95 ≤ 2 HU）
        working-directory: apps/debug
        run: npm run test:path-acceptance

      - name: 跳跃顶点权威验证（jump apex）
        working-directory: apps/debug
        run: npm run test:jump-apex

      - name: debug 贴坡蹲姿端到端（wasm 产物级）
        working-directory: apps/debug
        # 直读 apps/debug/pkg：贴坡松开蹲键保持蹲姿 / 落地即起立 / 空中蹲姿动量 == 站姿
        run: npm run test:surf-crouch

  # ── game 门禁（都读 apps/game/pkg）────────────────────────────────
  game-gates:
    name: game gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Cache wasm-bindgen-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.128-x86_64-linux

      - name: Install wasm-bindgen-cli 0.2.128 (cache → prebuilt → cargo install)
        shell: bash
        run: |
          set -euo pipefail
          if [ -x "$HOME/.cargo/bin/wasm-bindgen" ] &&
             "$HOME/.cargo/bin/wasm-bindgen" --version 2>/dev/null | grep -q '0.2.128'; then
            echo "[cache hit] wasm-bindgen-cli 0.2.128 已就绪"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          VERSION=0.2.128
          if curl -fSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 30 \
               -o /tmp/wbg.tar.gz \
               "https://github.com/rustwasm/wasm-bindgen/releases/download/${VERSION}/wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl.tar.gz"; then
            tar -xzf /tmp/wbg.tar.gz -C /tmp
            mkdir -p "$HOME/.cargo/bin"
            cp "/tmp/wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" "$HOME/.cargo/bin/"
            echo "[prebuilt] wasm-bindgen-cli ${VERSION} 已就位"
          else
            echo "[warn] 预编译包下载失败，退回 cargo install（首次编译数分钟，之后走 cache）"
            cargo install wasm-bindgen-cli --version "${VERSION}" --locked
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install game dependencies
        working-directory: apps/game
        run: npm ci

      - name: Build game WASM
        working-directory: apps/game
        # 下面三道门禁都直接读 apps/game/pkg/websurf_wasm_bg.wasm
        run: npm run build:wasm

      - name: game 物理冒烟（PhysWorld 基本行为）
        working-directory: apps/game
        run: npm run test:phys

      - name: game 种子面冒烟（确定性种子契约）
        working-directory: apps/game
        run: npm run test:seed-smoke

      - name: game 贴坡蹲姿端到端（wasm 产物级）
        working-directory: apps/game
        # 直读 pkg 产物：贴坡松开蹲键保持蹲姿 / 落地即起立 / 空中蹲姿动量 == 站姿
        run: npm run test:surf-crouch

  # ── viewer 门禁（纯 TS 自检，无需 wasm/pnpm 之外的任何构建）────────
  viewer-gates:
    name: viewer gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install viewer dependencies
        working-directory: apps/viewer
        run: npm ci

      - name: Run viewer replay selftest
        working-directory: apps/viewer
        # 只 esbuild 自检入口（src/replay/*），不依赖 pkg/ 与 wasm
        run: npm run test:replay
