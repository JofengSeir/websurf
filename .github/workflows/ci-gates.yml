# WebSurf: 构建与契约门禁（不含部署）
#
# 结构：门禁与部署解耦——部署只构建/发布 apps（见 deploy-pages.yml 的 build job），门禁在 PR 与
# main 上独立跑；三个 app 的 Rust 编译各在自己的 job 内进行。
#
# 本文件实际跑的清单：
#   rust-unit-tests — `cargo test -p websurf-phys`（共享层物理单测；含蹲姿/surf 回归、P2 幻影门）
#   source-contract — `apps/viewer` 的 `check-wasm-api.mjs --source-only`（Rust serde 键名 ↔ TS 接口键名；
#                     只读源码、不装 wasm 工具链、不建 pkg ⇒ 最便宜的一道，D-022 选项 (a)）
#   glb-parity      — 三端 `npm run build:wasm` + 三端 `check:api`（wasm 导出 ↔ TS 导入契约）
#   debug-gates / game-gates — **只剩 `npm run build:wasm`**：只证明这两端的 wasm 能在干净环境构建
#
# 历史：2026-10-12 的 T-653（削减验证层，删 26 个验证脚本/测试）把三端 package.json 的 test:*
# 门禁连同 CI 里调用它们的 step 一并删除，本文件自此不再跑 app 级回归门；两个 job 名保留原样
# （改名会打断分支保护里按 job 名登记的必需检查）。若日后恢复 app 级回归，需先重建对应测试脚本。

name: CI Gates

on:
  push:
    branches: [main]
    # 纯文档改动不跑门禁（文档由 Doc Drift Check 负责）
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── 共享层 Rust 单测（不需要 wasm-pack，最便宜的一道）──────────────
  rust-unit-tests:
    name: rust unit tests (websurf-phys)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo test -p websurf-phys
        run: cargo test -p websurf-phys

  # ── 源码级契约（不装 wasm 工具链、不建 pkg；D-022 选项 (a)）────────────────
  source-contract:
    name: source-level wasm contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: viewer Rust serde ↔ TS interface keys
        working-directory: apps/viewer
        run: node scripts/check-wasm-api.mjs --source-only

  # ── debug：wasm 构建冒烟（T-653 削减验证层后，本 job 只剩 build:wasm）────────
  debug-gates:
    name: debug gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      # wasm-bindgen-cli：缓存 → 预编译包（秒级）→ cargo install（兜底）。
      # 与 deploy-pages.yml 用同一个 cache key，两个 workflow 互相命中。
      - name: Cache wasm-bindgen-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.128-x86_64-linux

      - name: Install wasm-bindgen-cli 0.2.128 (cache → prebuilt → cargo install)
        shell: bash
        run: |
          set -euo pipefail
          if [ -x "$HOME/.cargo/bin/wasm-bindgen" ] &&
             "$HOME/.cargo/bin/wasm-bindgen" --version 2>/dev/null | grep -q '0.2.128'; then
            echo "[cache hit] wasm-bindgen-cli 0.2.128 已就绪"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          VERSION=0.2.128
          if curl -fSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 30 \
               -o /tmp/wbg.tar.gz \
               "https://github.com/rustwasm/wasm-bindgen/releases/download/${VERSION}/wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl.tar.gz"; then
            tar -xzf /tmp/wbg.tar.gz -C /tmp
            mkdir -p "$HOME/.cargo/bin"
            cp "/tmp/wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" "$HOME/.cargo/bin/"
            echo "[prebuilt] wasm-bindgen-cli ${VERSION} 已就位"
          else
            echo "[warn] 预编译包下载失败，退回 cargo install（首次编译数分钟，之后走 cache）"
            cargo install wasm-bindgen-cli --version "${VERSION}" --locked
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # renderer-shared（共享渲染层）依赖 three，three 的单实例装在仓库根 node_modules
      # —— 必须先装根级，再装工程级（工程 package.json 已不含 three）。
      - name: Install root shared dependencies
        run: npm ci

      - name: Install debug dependencies
        working-directory: apps/debug
        run: npm ci

      - name: Build debug WASM
        working-directory: apps/debug
        # 本 job 现在只做构建冒烟：确认 debug 的 wasm 能在干净环境构建出来。
        # （原注释依据的「门禁要用 esbuild 打包 renderer-main ⇒ 必须先有 pkg/」已随 T-653 失效。）
        run: npm run build:wasm

  # ── game：wasm 构建冒烟（同上，T-653 后本 job 只剩 build:wasm）──────────────
  game-gates:
    name: game gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Cache wasm-bindgen-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.128-x86_64-linux

      - name: Install wasm-bindgen-cli 0.2.128 (cache → prebuilt → cargo install)
        shell: bash
        run: |
          set -euo pipefail
          if [ -x "$HOME/.cargo/bin/wasm-bindgen" ] &&
             "$HOME/.cargo/bin/wasm-bindgen" --version 2>/dev/null | grep -q '0.2.128'; then
            echo "[cache hit] wasm-bindgen-cli 0.2.128 已就绪"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          VERSION=0.2.128
          if curl -fSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 30 \
               -o /tmp/wbg.tar.gz \
               "https://github.com/rustwasm/wasm-bindgen/releases/download/${VERSION}/wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl.tar.gz"; then
            tar -xzf /tmp/wbg.tar.gz -C /tmp
            mkdir -p "$HOME/.cargo/bin"
            cp "/tmp/wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" "$HOME/.cargo/bin/"
            echo "[prebuilt] wasm-bindgen-cli ${VERSION} 已就位"
          else
            echo "[warn] 预编译包下载失败，退回 cargo install（首次编译数分钟，之后走 cache）"
            cargo install wasm-bindgen-cli --version "${VERSION}" --locked
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # 根级 three（renderer-shared 依赖）：与 debug-gates 同理，先根后工程。
      - name: Install root shared dependencies
        run: npm ci

      - name: Install game dependencies
        working-directory: apps/game
        run: npm ci

      - name: Build game WASM
        working-directory: apps/game
        # 本 job 现在只做构建冒烟：确认 game 的 wasm 能在干净环境构建出来（T-653 后已无门禁 step 读 pkg/）。
        run: npm run build:wasm

  glb-parity:
    name: three-end GLB parity
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Cache wasm-bindgen-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.128-x86_64-linux

      - name: Install wasm-bindgen-cli 0.2.128 (cache → prebuilt → cargo install)
        shell: bash
        run: |
          set -euo pipefail
          if [ -x "$HOME/.cargo/bin/wasm-bindgen" ] &&
             "$HOME/.cargo/bin/wasm-bindgen" --version 2>/dev/null | grep -q '0.2.128'; then
            echo "[cache hit] wasm-bindgen-cli 0.2.128 已就绪"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          VERSION=0.2.128
          if curl -fSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 30 \
               -o /tmp/wbg.tar.gz \
               "https://github.com/rustwasm/wasm-bindgen/releases/download/${VERSION}/wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl.tar.gz"; then
            tar -xzf /tmp/wbg.tar.gz -C /tmp
            mkdir -p "$HOME/.cargo/bin"
            cp "/tmp/wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" "$HOME/.cargo/bin/"
            echo "[prebuilt] wasm-bindgen-cli ${VERSION} 已就位"
          else
            echo "[warn] 预编译包下载失败，退回 cargo install（首次编译数分钟，之后走 cache）"
            cargo install wasm-bindgen-cli --version "${VERSION}" --locked
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # 根级 three（renderer-shared 依赖）：与 debug-gates 同理，先根后工程。
      - name: Install root shared dependencies
        run: npm ci

      - name: Build the three WASM packages
        shell: bash
        run: |
          set -euo pipefail
          for app in debug game viewer; do
            echo "== apps/$app =="
            (cd "apps/$app" && npm ci && npm run build:wasm)
          done

      - name: WASM API contract (three ends)
        shell: bash
        run: |
          set -euo pipefail
          for app in debug game viewer; do
            echo "== apps/$app check:api =="
            (cd "apps/$app" && node scripts/check-wasm-api.mjs)
          done
