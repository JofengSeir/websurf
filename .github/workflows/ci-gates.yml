# WebSurf: 测试门禁（不含部署）
#
# 由来（2026-09-21）：原先所有门禁都挂在 deploy-pages.yml 的 build job 里，导致
#   - 每次部署要额外编译 test/dual-mode-harness 的 wasm（147 s），只为给 debug 的
#     `test:jump-apex` 提供 pkg；
#   - 任何一个门禁失败都会让「部署」失败（9-21 的 E0063/E0308 就是这么挡住发布的）；
#   - 三个 app 的 Rust 编译串行。
# 现在把门禁整体移到这里，与部署解耦：部署只构建/发布 apps，门禁在 PR 与 main 上独立跑。
#
# 门禁清单（与各工程 package.json 的 test:* 对齐，规范 §6.2「test:* ⊆ CI」）：
#   rust-unit-tests — `cargo test -p websurf-phys`（共享层物理单测；含蹲姿/surf 回归、P2 幻影门）
#   harness         — test/dual-mode-harness：wasm + ts + three-mode 运行时验证
#   debug           — test:optimize-scene / test:auth-clock / test:path-acceptance / test:jump-apex
#                     （jump-apex 读 test/dual-mode-harness/pkg，故排在同一 job 的 harness 之后）
#   game            — test:phys / test:seed-smoke / test:surf-crouch（都读 apps/game/pkg）
#   viewer          — test:replay（纯 TS 自检，不依赖 pkg）
#
# 已知未纳入（另案）：
#   - `test:glb-contract`（test/dual-mode-harness）：它要同时加载 apps/{game,debug,viewer} 与
#     `test/game-core` 四份 pkg，而 test/game-core 已于 9-21 转为本地工程（不入库）→ 在 CI 上
#     无法成立，需重做或删掉该门。
#   - `debug:test:surf-crouch`：与 game 侧脚本逐字节相同（同一份 wasm 端到端验证），
#     为它单独编译一次 debug wasm 需 +150 s，收益为零，故只跑 game 侧。

name: CI Gates

on:
  push:
    branches: [main]
    # 纯文档改动不跑门禁（文档由 Doc Drift Check 负责）
    paths-ignore:
      - 'documents/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'documents/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── 共享层 Rust 单测（不需要 wasm-pack，最便宜的一道）──────────────
  rust-unit-tests:
    name: rust unit tests (websurf-phys)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo test -p websurf-phys
        run: cargo test -p websurf-phys

  # ── 验证工程 + debug 门禁（jump-apex 需要 harness pkg，故同一 job 内先建 harness）──
  harness-and-debug-gates:
    name: harness + debug gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      # wasm-bindgen-cli：缓存 → 预编译包（秒级）→ cargo install（兜底）。
      # 与 deploy-pages.yml 用同一个 cache key，两个 workflow 互相命中。
      - name: Cache wasm-bindgen-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.128-x86_64-linux

      - name: Install wasm-bindgen-cli 0.2.128 (cache → prebuilt → cargo install)
        shell: bash
        run: |
          set -euo pipefail
          if [ -x "$HOME/.cargo/bin/wasm-bindgen" ] &&
             "$HOME/.cargo/bin/wasm-bindgen" --version 2>/dev/null | grep -q '0.2.128'; then
            echo "[cache hit] wasm-bindgen-cli 0.2.128 已就绪"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          VERSION=0.2.128
          if curl -fSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 30 \
               -o /tmp/wbg.tar.gz \
               "https://github.com/rustwasm/wasm-bindgen/releases/download/${VERSION}/wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl.tar.gz"; then
            tar -xzf /tmp/wbg.tar.gz -C /tmp
            mkdir -p "$HOME/.cargo/bin"
            cp "/tmp/wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" "$HOME/.cargo/bin/"
            echo "[prebuilt] wasm-bindgen-cli ${VERSION} 已就位"
          else
            echo "[warn] 预编译包下载失败，退回 cargo install（首次编译数分钟，之后走 cache）"
            cargo install wasm-bindgen-cli --version "${VERSION}" --locked
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # harness 的 pkg 是 debug `test:jump-apex` 的前置（缺 pkg 时该门会 [SKIP] 而非失败）。
      - name: Install dual-mode-harness dependencies
        working-directory: test/dual-mode-harness
        run: npm ci

      - name: Build dual-mode-harness WASM
        working-directory: test/dual-mode-harness
        run: npm run build:wasm

      - name: Build dual-mode-harness TypeScript (main/worker-a/worker-b)
        working-directory: test/dual-mode-harness
        run: npm run build:ts

      - name: dual-mode-harness 三模式运行时验证
        working-directory: test/dual-mode-harness
        # 三模式（coupled/decoupled/tick）运行时装配 + 热切握手 + 遥测链路（14 断言）
        run: npm run test:three-mode

      - name: Install debug dependencies
        working-directory: apps/debug
        run: npm ci

      # 渲染性能回归门：面片规模地图（surf_666 GLB = 34409 primitive）必须经 optimizeScene
      # 合并到 300~800 块（否则每帧 3.4 万次 draw call）。断言顶点守恒 + 块数区间。
      - name: Verify debug optimizeScene (GLB 空间分块合并)
        working-directory: apps/debug
        run: npm run test:optimize-scene

      # 权威时钟回归门：tickRate 配置消息不得丢仿真时间（旧行为会把 63.6 tick/s 打到 0.5）。
      - name: 权威时钟验证（配置消息不得丢仿真时间）
        working-directory: apps/debug
        run: npm run test:auth-clock

      # tick→渲染 路径垂距门：Worker 权威帧的发布位置必须是渲染轨迹上的采样点。
      # 夹具是「缺陷存在时」的真实录制，配 --expect fail —— 判别力自检。
      - name: tick→render 路径垂距验收（稳态 p95 ≤ 2 HU）
        working-directory: apps/debug
        run: npm run test:path-acceptance

      - name: 跳跃顶点权威验证（jump apex）
        working-directory: apps/debug
        run: npm run test:jump-apex

  # ── game 门禁（都读 apps/game/pkg）────────────────────────────────
  game-gates:
    name: game gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Cache wasm-bindgen-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.128-x86_64-linux

      - name: Install wasm-bindgen-cli 0.2.128 (cache → prebuilt → cargo install)
        shell: bash
        run: |
          set -euo pipefail
          if [ -x "$HOME/.cargo/bin/wasm-bindgen" ] &&
             "$HOME/.cargo/bin/wasm-bindgen" --version 2>/dev/null | grep -q '0.2.128'; then
            echo "[cache hit] wasm-bindgen-cli 0.2.128 已就绪"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          VERSION=0.2.128
          if curl -fSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 30 \
               -o /tmp/wbg.tar.gz \
               "https://github.com/rustwasm/wasm-bindgen/releases/download/${VERSION}/wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl.tar.gz"; then
            tar -xzf /tmp/wbg.tar.gz -C /tmp
            mkdir -p "$HOME/.cargo/bin"
            cp "/tmp/wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" "$HOME/.cargo/bin/"
            echo "[prebuilt] wasm-bindgen-cli ${VERSION} 已就位"
          else
            echo "[warn] 预编译包下载失败，退回 cargo install（首次编译数分钟，之后走 cache）"
            cargo install wasm-bindgen-cli --version "${VERSION}" --locked
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install game dependencies
        working-directory: apps/game
        run: npm ci

      - name: Build game WASM
        working-directory: apps/game
        # 下面三道门禁都直接读 apps/game/pkg/websurf_wasm_bg.wasm
        run: npm run build:wasm

      - name: game 物理冒烟（PhysWorld 基本行为）
        working-directory: apps/game
        run: npm run test:phys

      - name: game 种子面冒烟（确定性种子契约）
        working-directory: apps/game
        run: npm run test:seed-smoke

      - name: game 贴坡蹲姿端到端（wasm 产物级）
        working-directory: apps/game
        # 直读 pkg 产物：贴坡松开蹲键保持蹲姿 / 落地即起立 / 空中蹲姿动量 == 站姿
        run: npm run test:surf-crouch

  # ── viewer 门禁（纯 TS 自检，无需 wasm/pnpm 之外的任何构建）────────
  viewer-gates:
    name: viewer gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install viewer dependencies
        working-directory: apps/viewer
        run: npm ci

      - name: Run viewer replay selftest
        working-directory: apps/viewer
        # 只 esbuild 自检入口（src/replay/*），不依赖 pkg/ 与 wasm
        run: npm run test:replay
