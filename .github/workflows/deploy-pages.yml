# WebSurf: 构建并部署到 GitHub Pages
#
# 仓库布局（三个同级应用工程 + 两个验证工程，共享仓库根 src/ Rust/TS 共享层）：
#   debug/     = 主工程（Debug Build，共享 Rust 物理，多文件 dist）
#   game/      = WebSurf-game（Game Build，共享 Rust 物理，多文件 dist）
#   viewer/    = WebSurf-viewer（BSP 游览 + 录像回放，仅解析层，single dist）
#   test/dual-mode-harness、test/instanced-diorama = 验证工程（仅构建验证，不部署）
#
# 各应用工程构建链路（与本地 build-dist.cmd 一致）：
#   1. wasm-pack 编译 crates/wasm → pkg/（wasm-bindgen-cli 0.2.128 与五份 Cargo.lock 统一匹配；
#      仓库根 .cargo/config.toml 使全部构建共享根 target/ 缓存）
#   2. esbuild 打包 TypeScript（worker + app）
#   3. scripts/build-dist.mjs --multi 生成多文件 dist/（app.js + worker.js + wasm 外置 + textures.mtz 外置，
#      Pages HTTP 环境；single 模式仅本地 file:// 使用——viewer 例外，其 dist 为 single-only）
#
# 部署产物为 dist/（相对路径引用，兼容 Pages 的 /<repo>/ 子路径）。

name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # 不要用 "pages"：与 GitHub 内部 "pages build and deployment" 并发组同名，
  # 会导致内部构建出现时本 workflow 被 cancel-in-progress 取消（8-06 实测两次）。
  group: "pages-deploy-websurf"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 20 已弃用（GH Actions 提示默认 24）；22 为 LTS 稳定线（esbuild/wasm-pack 兼容）
          node-version: 22
          # 重构后 lock 文件在各工程（debug/package-lock.json、game/package-lock.json 等），
          # 根目录无锁文件——必须 glob 匹配，否则 cache: npm 报
          # "Dependencies lock file is not found"（8-09 CI 失败根因）
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Install wasm-bindgen-cli 0.2.128 (prebuilt, matches Cargo.lock)
        shell: bash
        run: |
          set -euo pipefail
          VERSION=0.2.128
          curl -sSL --retry 3 -o /tmp/wbg.tar.gz \
            "https://github.com/rustwasm/wasm-bindgen/releases/download/${VERSION}/wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/wbg.tar.gz -C /tmp
          mkdir -p "$HOME/.cargo/bin"
          cp "/tmp/wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" "$HOME/.cargo/bin/"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # ── debug/ 主工程（Debug Build，调试测试页面）─────────────
      - name: Install debug dependencies
        working-directory: debug
        run: npm ci

      - name: Build debug WASM
        working-directory: debug
        run: npm run build:wasm

      - name: "Build debug TypeScript (typecheck + bundle)"
        working-directory: debug
        run: npm run build:ts

      - name: Build debug dist package
        working-directory: debug
        # multi 模式：多文件（app/worker/wasm/mtz 分离），HTTP 部署 fetch 正常，体积更小
        run: node scripts/build-dist.mjs --multi

      # ── game/ 独立工程（WebSurf-game，尝试游戏化）────────────────
      - name: Install game dependencies
        working-directory: game
        run: npm ci

      - name: Build game WASM
        working-directory: game
        run: npm run build:wasm

      - name: "Build game TypeScript (typecheck + bundle: worker/app)"
        working-directory: game
        run: npm run build:ts

      - name: Build game dist package
        working-directory: game
        # multi 模式：多文件（app/worker/wasm/mtz 分离），HTTP 部署 fetch 正常
        run: node scripts/build-dist.mjs --multi

      # ── viewer/（WebSurf-viewer，BSP 游览 + 录像回放，single dist）──────
      - name: Install viewer dependencies
        working-directory: viewer
        run: npm ci

      - name: Build viewer WASM
        working-directory: viewer
        run: npm run build:wasm

      - name: "Build viewer TypeScript (typecheck + bundle app/parse-worker)"
        working-directory: viewer
        run: npm run build:ts

      - name: Build viewer dist package
        working-directory: viewer
        # single 模式（viewer 唯一产物形态）：IIFE + wasm base64 内嵌，HTTP/file:// 皆可用
        run: npm run build:dist

      - name: Run viewer replay selftest
        working-directory: viewer
        run: npm run test:replay

      # ── test/ 验证工程（仅构建验证，不部署）────────────────────
      - name: Install dual-mode-harness dependencies
        working-directory: test/dual-mode-harness
        run: npm ci

      - name: Build dual-mode-harness WASM
        working-directory: test/dual-mode-harness
        run: npm run build:wasm

      - name: "Build dual-mode-harness TypeScript (main/worker-a/worker-b)"
        working-directory: test/dual-mode-harness
        run: npm run build:ts

      - name: Install instanced-diorama dependencies
        working-directory: test/instanced-diorama
        run: npm ci

      - name: Build instanced-diorama WASM
        working-directory: test/instanced-diorama
        run: npm run build:wasm

      - name: Build instanced-diorama TypeScript
        working-directory: test/instanced-diorama
        run: npm run build:ts

      # ── 组装 Pages 部署目录（入口页 + debug/ + game/ + viewer/）──
      - name: Assemble Pages deploy directory
        run: |
          mkdir -p deploy/debug deploy/game deploy/viewer
          cp -r debug/dist/. deploy/debug/
          cp -r game/dist/. deploy/game/
          cp -r viewer/dist/. deploy/viewer/
          cp debug/scripts/pages-index.html deploy/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
