# WebSurf: 构建并部署到 GitHub Pages
#
# 职责边界：本 workflow **只做一件事**——把 apps/{debug,game,viewer} 构建成 dist/ 并发布到
# Pages。它不含任何测试门禁（门禁在 `.github/workflows/ci-gates.yml`，与部署互不阻塞）。
#
# 为什么这样拆：
#   - 三个 app 的 wasm 编译是相互独立的，用 matrix 并行构建：墙钟时间由「三者之和」
#     降到「最慢那个」。
#   - 测试门禁不放在这里（见 ci-gates.yml）：任一测试门失败都不应让站点发布失败。
#
# 三工程构建链路（与本地 build-dist.cmd 一致）：
#   1. wasm-pack 编译 crates/wasm → pkg/（wasm-bindgen-cli 0.2.128 与五份 Cargo.lock 匹配）
#   2. esbuild 打包 TypeScript（worker + app）
#   3. scripts/build-dist.mjs --multi → dist/（app.js + worker.js + wasm/mtz 外置）
#
# 触发路径：只有会影响站点产物的路径才触发（apps/**、src/**、Cargo.toml、Cargo.lock 与本文件）。
# 文档与门禁 workflow 的改动不触发重新部署（需要时用 workflow_dispatch 手动跑）。

name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # 不要用 "pages"：与 GitHub 内部 "pages build and deployment" 并发组同名，
  # 会导致内部构建出现时本 workflow 被 cancel-in-progress 取消（8-06 实测两次）。
  group: "pages-deploy-websurf"
  cancel-in-progress: true

jobs:
  # ── 三个应用工程并行构建（互不阻塞：一个挂了不影响另两个的日志）──────
  build-app:
    name: build ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [debug, game, viewer]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 20 已弃用（GH Actions 提示默认 24）；22 为 LTS 稳定线（esbuild/wasm-pack 兼容）
          node-version: 22
          # lock 文件在各工程（apps/*/package-lock.json），根目录无锁文件——
          # 必须 glob 匹配，否则 cache: npm 报 "Dependencies lock file is not found"
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      # wasm-bindgen-cli 的策略见 ci-gates.yml 同名步骤：缓存 → 预编译包 → cargo install 兜底。
      # 三个矩阵 job 共用同一个 cache key（并发写入时后到者静默失败，不影响构建）。
      - name: Cache wasm-bindgen-cli
        id: cache-wbg
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.128-x86_64-linux

      - name: Install wasm-bindgen-cli 0.2.128 (cache → prebuilt → cargo install)
        shell: bash
        run: |
          set -euo pipefail
          if [ -x "$HOME/.cargo/bin/wasm-bindgen" ] &&
             "$HOME/.cargo/bin/wasm-bindgen" --version 2>/dev/null | grep -q '0.2.128'; then
            echo "[cache hit] wasm-bindgen-cli 0.2.128 已就绪"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          # 优先下预编译包（秒级）；release 端点不稳定时再退回 cargo install（数分钟）
          VERSION=0.2.128
          if curl -fSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 30 \
               -o /tmp/wbg.tar.gz \
               "https://github.com/rustwasm/wasm-bindgen/releases/download/${VERSION}/wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl.tar.gz"; then
            tar -xzf /tmp/wbg.tar.gz -C /tmp
            mkdir -p "$HOME/.cargo/bin"
            cp "/tmp/wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" "$HOME/.cargo/bin/"
            echo "[prebuilt] wasm-bindgen-cli ${VERSION} 已就位"
          else
            echo "[warn] 预编译包下载失败，退回 cargo install（首次编译数分钟，之后走 cache）"
            cargo install wasm-bindgen-cli --version "${VERSION}" --locked
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: npm ci

      - name: Build WASM
        working-directory: apps/${{ matrix.app }}
        run: npm run build:wasm

      - name: Build TypeScript (typecheck + bundle)
        working-directory: apps/${{ matrix.app }}
        run: npm run build:ts

      - name: Build dist package
        working-directory: apps/${{ matrix.app }}
        # multi 模式：多文件（app/worker/wasm/mtz 分离），HTTP 部署 fetch 正常、体积更小。
        # 走 package.json 唯一入口（规范 §6.2 禁止 CI 绕过 npm 直接调工程脚本）。
        run: npm run build:dist -- --multi

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.app }}
          path: apps/${{ matrix.app }}/dist
          if-no-files-found: error

  # ── 组装 + 发布（三份 dist 齐了才跑）──────────────────────────────
  deploy:
    name: assemble & deploy
    needs: build-app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 组装只需要 checkout 拿入口页模板（apps/debug/scripts/pages-index.html）。
      - name: Checkout (entry page template)
        uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: deploy-tmp

      - name: Assemble Pages deploy directory
        run: |
          set -euo pipefail
          # download-artifact@v4 按 pattern 命中时，每个 artifact 解到 `<path>/<artifact 名>/`。
          # 再下钻一层做兼容（万一产物多包了一层目录），并**断言入口页存在**——
          # 宁可这里硬失败，也不要静默发布一个缺文件、点开就 404 的站点。
          for app in debug game viewer; do
            src="deploy-tmp/dist-${app}"
            test -d "$src" || { echo "[error] 缺少 artifact dist-${app}"; exit 1; }
            while [ ! -f "$src/index.html" ]; do
              inner="$(find "$src" -mindepth 1 -maxdepth 1 -type d -print -quit)"
              [ -n "$inner" ] || break
              src="$inner"
            done
            test -f "$src/index.html" || { echo "[error] dist-${app} 里找不到 index.html（src=$src）"; exit 1; }
            mkdir -p "deploy/${app}"
            cp -r "$src/." "deploy/${app}/"
          done
          cp apps/debug/scripts/pages-index.html deploy/index.html
          echo "[ok] deploy 目录："
          du -sh deploy/* | sort -k2

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
