# WebSurf: 构建并部署到 GitHub Pages
#
# 仓库布局（三个同级应用工程 + 一个验证工程，共享仓库根 src/ Rust/TS 共享层）：
#   apps/debug/ = 主工程（Debug Build，共享 Rust 物理，多文件 dist）
#   apps/game/ = WebSurf-game（Game Build，共享 Rust 物理，多文件 dist）
#   apps/viewer/ = WebSurf-viewer（BSP 游览 + 录像回放，仅解析层，single dist）
#   test/dual-mode-harness = 验证工程（仅构建验证，不部署）
#
# 各应用工程构建链路（与本地 build-dist.cmd 一致）：
#   1. wasm-pack 编译 crates/wasm → pkg/（wasm-bindgen-cli 0.2.128 与五份 Cargo.lock（4 模块工程 + 根）统一匹配；
#      四个模块 workspace 各自保留 target/，根 workspace 的 target/ 位于仓库根，不再跨 workspace 复用编译缓存）
#   2. esbuild 打包 TypeScript（worker + app）
#   3. scripts/build-dist.mjs --multi 生成多文件 dist/（app.js + worker.js + wasm 外置 + textures.mtz 外置，
#      Pages HTTP 环境；single 模式仅本地 file:// 使用——viewer 例外，其 dist 为 single-only）
#
# 部署产物为 dist/（相对路径引用，兼容 Pages 的 /<repo>/ 子路径）。

name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # 不要用 "pages"：与 GitHub 内部 "pages build and deployment" 并发组同名，
  # 会导致内部构建出现时本 workflow 被 cancel-in-progress 取消（8-06 实测两次）。
  group: "pages-deploy-websurf"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 20 已弃用（GH Actions 提示默认 24）；22 为 LTS 稳定线（esbuild/wasm-pack 兼容）
          node-version: 22
          # 重构后 lock 文件在各工程（apps/debug/package-lock.json、apps/game/package-lock.json 等），
          # 根目录无锁文件——必须 glob 匹配，否则 cache: npm 报
          # "Dependencies lock file is not found"（8-09 CI 失败根因）
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Install wasm-bindgen-cli 0.2.128 (prebuilt, matches Cargo.lock)
        shell: bash
        run: |
          set -euo pipefail
          VERSION=0.2.128
          curl -sSL --retry 3 -o /tmp/wbg.tar.gz \
            "https://github.com/rustwasm/wasm-bindgen/releases/download/${VERSION}/wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/wbg.tar.gz -C /tmp
          mkdir -p "$HOME/.cargo/bin"
          cp "/tmp/wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" "$HOME/.cargo/bin/"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # ── debug/ 主工程（Debug Build，调试测试页面）─────────────
      - name: Install debug dependencies
        working-directory: apps/debug
        run: npm ci || npm ci

      - name: Build debug WASM
        working-directory: apps/debug
        run: npm run build:wasm

      - name: "Build debug TypeScript (typecheck + bundle)"
        working-directory: apps/debug
        run: npm run build:ts

      - name: Build debug dist package
        working-directory: apps/debug
        # multi 模式：多文件（app/worker/wasm/mtz 分离），HTTP 部署 fetch 正常，体积更小
        # 走 package.json 唯一入口（规范 §6.2 禁止 CI 绕过 npm 直接调工程脚本）
        run: npm run build:dist -- --multi -- --multi

      # ── dual-mode-harness WASM（jump-apex 门依赖其 pkg，需先构建）──
      - name: Install dual-mode-harness dependencies
        working-directory: test/dual-mode-harness
        run: npm ci || npm ci

      - name: Build dual-mode-harness WASM
        working-directory: test/dual-mode-harness
        run: npm run build:wasm

      - name: Verify debug optimizeScene (GLB 空间分块合并)
        working-directory: apps/debug
        # 渲染性能回归门：面片规模的地图（实测 surf_666 GLB = 34409 primitive →
        # 未合并时场景 3.4 万 THREE.Mesh，每帧全量视锥剔除 + 逐 mesh draw call）
        # 必须走 optimizeScene 合并到 300~800 块。断言顶点守恒 + 块数区间。
        run: npm run test:optimize-scene

      # 权威时钟回归门：`input-bridge` 把 tickRate 塞进每一条 physics 配置消息，
      # 而调用方原先无条件 `setFixedDt + reset()`；`reset()` 会永久丢弃累积器余数 +
      # 一次唤醒区间。实测（确定性 Node 测试）在 4ms 间隔的配置消息下权威时钟从
      # 63.6 tick/s 崩到 0.5 tick/s = 用户报告的「tick 计算滑落、拖累渲染」。
      # 断言：新契约下 tick 率与基线一致，且旧行为会复现缺陷。
      - name: 权威时钟验证（配置消息不得丢仿真时间）
        working-directory: apps/debug
        run: npm run test:auth-clock

      # tick→渲染 路径垂距验收门：Worker 权威帧的**发布位置**必须是渲染轨迹上的一个
      # 采样点（每个 tick 点到渲染折线的最短距离 ≈0）。度量 = 垂距（对线段投影钳位；
      # 跳变 >100 HU 的段不参与），与面板"偏差梳"（时间对齐、含切向滞后）**不是同一个量**。
      # 阈值（稳态总体，剔除传送邻近点）：p95 ≤ 2 HU / max ≤ 10 HU / 毛刺 ≤ 1% / 剔除 ≤ 10%。
      # 当前夹具 = tick-on-render-prefix.json（**缺陷存在时**的真实录制，实测稳态 p95=36.52 HU），
      # 配 `--expect fail` —— 即本步是**判别力自检**：证明这道门确实能识破"发布位置不在渲染
      # 轨迹上"的缺陷。修好后的真实录制到手后再加一个 `--expect pass` 的夹具（见
      # debug/scripts/path-baseline.md 的两夹具语义）。
      - name: tick→render 路径垂距验收（稳态 p95 ≤ 2 HU）
        working-directory: apps/debug
        run: npm run test:path-acceptance

      # 跳跃顶点权威验证门（批 1 修好层数缺陷后，规范 §6.2 要求 test:* ⊆ CI）
      - name: 跳跃顶点权威验证（jump apex）
        working-directory: apps/debug
        run: npm run test:jump-apex

      # ── game/ 独立工程（WebSurf-game，尝试游戏化）────────────────
      - name: Install game dependencies
        working-directory: apps/game
        run: npm ci || npm ci

      - name: Build game WASM
        working-directory: apps/game
        run: npm run build:wasm

      - name: "Build game TypeScript (typecheck + bundle: worker/app)"
        working-directory: apps/game
        run: npm run build:ts

      - name: Build game dist package
        working-directory: apps/game
        # multi 模式：多文件（app/worker/wasm/mtz 分离），HTTP 部署 fetch 正常
        # 走 package.json 唯一入口（规范 §6.2 禁止 CI 绕过 npm 直接调工程脚本）
        run: npm run build:dist -- --multi

      # 物理冒烟门：game 的 Rust 物理（PhysWorld）基本行为回归。脚本直接读
      # apps/game/pkg/websurf_wasm_bg.wasm（scripts/phys-smoke.mjs:7,13），
      # 上面的 build:wasm 已生成 pkg/，无需浏览器。
      - name: game 物理冒烟（PhysWorld 基本行为）
        working-directory: apps/game
        run: npm run test:phys

      # 种子面冒烟门：确定性种子面契约（scripts/phys-seed-smoke.mjs:18,24，
      # 与 test:phys 同源读 pkg/）。两条同为 CONTRIBUTING §4 登记的门禁。
      - name: game 种子面冒烟（确定性种子契约）
        working-directory: apps/game
        run: npm run test:seed-smoke

      # ── viewer/（WebSurf-viewer，BSP 游览 + 录像回放，single dist）──────
      - name: Install viewer dependencies
        working-directory: apps/viewer
        run: npm ci || npm ci

      - name: Build viewer WASM
        working-directory: apps/viewer
        run: npm run build:wasm

      - name: "Build viewer TypeScript (typecheck + bundle app/worker)"
        working-directory: apps/viewer
        run: npm run build:ts

      - name: Build viewer dist package
        working-directory: apps/viewer
        # single 模式（viewer 唯一产物形态）：IIFE + wasm base64 内嵌，HTTP/file:// 皆可用
        run: npm run build:dist

      - name: Run viewer replay selftest
        working-directory: apps/viewer
        run: npm run test:replay

      # ── test/ 验证工程（仅构建验证，不部署）────────────────────
      - name: "Build dual-mode-harness TypeScript (main/worker-a/worker-b)"
        working-directory: test/dual-mode-harness
        run: npm run build:ts

      - name: Run dual-mode-harness three-mode runtime verification
        working-directory: test/dual-mode-harness
        # 三模式（coupled/decoupled/tick）运行时装配 + 热切握手 + 遥测链路（14 断言，
        # 驱动 build:ts 产物 worker-a.js）——game 侧模式切换已回退，此处为唯一运行面
        run: npm run test:three-mode

      # ── 组装 Pages 部署目录（入口页 + apps/{debug,game,viewer}）──
      - name: Assemble Pages deploy directory
        run: |
          mkdir -p deploy/debug deploy/game deploy/viewer
          cp -r apps/debug/dist/. deploy/debug/
          cp -r apps/game/dist/. deploy/game/
          cp -r apps/viewer/dist/. deploy/viewer/
          cp apps/debug/scripts/pages-index.html deploy/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
