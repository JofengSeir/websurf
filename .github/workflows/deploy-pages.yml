# WebSurf: 构建并部署到 GitHub Pages
#
# 仓库布局（两个同级独立工程）：
#   debug/ = 主工程（Debug Build，共享 Rust 物理，多文件 dist）
#   game/  = WebSurf-game（Game Build，共享 Rust 物理，多文件 dist）
#
# 两端构建链路（与本地 build-dist.cmd 一致）：
#   1. wasm-pack 编译 crates/wasm → pkg/（wasm-bindgen-cli 0.2.126 与 Cargo.lock 精确匹配）
#   2. esbuild 打包 TypeScript（worker + app）
#   3. scripts/build-dist.mjs --multi 生成多文件 dist/（app.js + worker.js + wasm 外置 + textures.mtz 外置，
#      Pages HTTP 环境；single 模式仅本地 file:// 使用）
#
# 部署产物为 dist/（相对路径引用，兼容 Pages 的 /<repo>/ 子路径）。

name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # 不要用 "pages"：与 GitHub 内部 "pages build and deployment" 并发组同名，
  # 会导致内部构建出现时本 workflow 被 cancel-in-progress 取消（8-06 实测两次）。
  group: "pages-deploy-websurf"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 20 已弃用（GH Actions 提示默认 24）；22 为 LTS 稳定线（esbuild/wasm-pack 兼容）
          node-version: 22
          # 重构后 lock 文件在两端工程（debug/package-lock.json + game/package-lock.json），
          # 根目录无锁文件——必须 glob 匹配，否则 cache: npm 报
          # "Dependencies lock file is not found"（8-09 CI 失败根因）
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Install wasm-bindgen-cli 0.2.126 (prebuilt, matches Cargo.lock)
        shell: bash
        run: |
          set -euo pipefail
          VERSION=0.2.126
          curl -sSL --retry 3 -o /tmp/wbg.tar.gz \
            "https://github.com/rustwasm/wasm-bindgen/releases/download/${VERSION}/wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/wbg.tar.gz -C /tmp
          mkdir -p "$HOME/.cargo/bin"
          cp "/tmp/wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl/wasm-bindgen" "$HOME/.cargo/bin/"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # ── debug/ 主工程（Debug Build，调试测试页面）─────────────
      - name: Install debug dependencies
        working-directory: debug
        run: npm ci

      - name: Build debug WASM
        working-directory: debug
        run: npm run build:wasm

      - name: "Build debug TypeScript (typecheck + bundle)"
        working-directory: debug
        run: npm run build:ts

      - name: Build debug dist package
        working-directory: debug
        # multi 模式：多文件（app/worker/wasm/mtz 分离），HTTP 部署 fetch 正常，体积更小
        run: node scripts/build-dist.mjs --multi

      # ── game/ 独立工程（WebSurf-game，尝试游戏化）────────────────
      - name: Install game dependencies
        working-directory: game
        run: npm ci

      - name: Build game WASM
        working-directory: game
        run: npm run build:wasm

      - name: "Build game TypeScript (typecheck + bundle: worker/app/predictor)"
        working-directory: game
        run: npm run build:ts

      - name: Build game dist package
        working-directory: game
        # multi 模式：多文件（app/worker/wasm/mtz 分离），HTTP 部署 fetch 正常
        run: node scripts/build-dist.mjs --multi

      # ── 组装 Pages 部署目录（入口页 + debug/ + game/）───────────
      - name: Assemble Pages deploy directory
        run: |
          mkdir -p deploy/debug deploy/game
          cp -r debug/dist/. deploy/debug/
          cp -r game/dist/. deploy/game/
          cp debug/scripts/pages-index.html deploy/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
