# WebSurf — 仓库根 Cargo workspace（共享层）
#
# 本 workspace 只收共享层 crate：websurf-phys（src/）与 websurf-wasm-core（src/wasm-core）。
#
# ── 为什么五个模块 crate 不进来 ─────────────────────────────────────
# debug / game / test/instanced-diorama 的 wasm crate 都叫 `websurf-wasm`（wasm-bindgen
# 导出层有意各自维护，见 src/wasm-core/Cargo.toml 头注），Cargo workspace 不允许同名成员，
# 而改名会连锁改 40+ 处产物名引用（pkg/websurf_wasm_bg.* 的 fetch/内嵌/校验脚本）。
# 因此模块 crate 保留各自 workspace（debug/ 等 4 个 + instanced 新增根，见各模块 Cargo.toml），
# 通过仓库级 .cargo/config.toml 让**所有** cargo/wasm-pack 构建共用根 target/——
# 共享 crate 与三方依赖（image/gltf/wasm-bindgen…）全仓库只编译一份。
#
# ── vmdl vendor patch ──────────────────────────────────────────────
# vmdl 由 crates.io 0.2.0 vendor 到 src/vendor/vmdl，修复 Source VTX 三角形条带展开算法
# （原实现奇数位生成退化三角形 + 末尾索引越界 → 模型边角出现杂散"四角面"）。
# 详见 src/vendor/vmdl/Cargo.toml 与 src/vendor/vmdl/src/vtx/mod.rs::Strip::indices。
# 注意：[patch] 只对"声明它的 workspace"生效——根这里管共享层两个 crate；
# 各模块 workspace 的同款 patch 在 debug/game/viewer/test 各自的 Cargo.toml。

[workspace]
resolver = "2"
members = [
    "src",            # websurf-phys：共享物理系统
    "src/wasm-core",  # websurf-wasm-core：共享 BSP/GLB/模型解析导出
]

[patch.crates-io]
vmdl = { path = "src/vendor/vmdl" }

# ============================================================
# 性能优化配置（构建共享层本体时生效；模块各自 workspace 亦有一份）
# ============================================================
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
