# websurf — Rust workspace 根
#
# 单一 WASM crate（crates/wasm），负责 BSP 解析、碰撞体导出、GLB 生成、
# 传送点/PVS 数据解析等全部编译到 WebAssembly 的 Rust 逻辑。

[workspace]
members = ["crates/wasm"]
resolver = "2"

# vmdl 由 crates.io 0.2.0 vendor 到 vendor/vmdl，修复 Source VTX 三角形条带展开算法
# （原实现奇数位生成退化三角形 + 末尾索引越界 → 模型边角出现杂散"四角面"）。
# 详见 vendor/vmdl/Cargo.toml 与 vendor/vmdl/src/vtx/mod.rs::Strip::indices。
[patch.crates-io]
vmdl = { path = "vendor/vmdl" }

# ============================================================
# 性能优化配置（WASM 构建需启用 LTO + 优化）
# ============================================================
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
