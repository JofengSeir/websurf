# WebSurf — 仓库根 Cargo workspace（D-133 起为仓库唯一的 workspace）
#
# 2026-11-25（D-133）起仓库内只有一个 Cargo workspace：一个 Cargo.lock、一个 target/。
# 六个成员：
# - src/                     websurf-phys：共享物理内核
# - src/wasm-core/           websurf-wasm-core：BSP/GLB/模型解析导出核心
# - src/wasm-bindings/       websurf-wasm-bindings：三端共享 wasm-bindgen 导出层（按 features）
# - apps/debug/crates/wasm/  websurf-debug-wasm：debug 端 wasm 薄壳
# - apps/game/crates/wasm/   websurf-game-wasm：game 端 wasm 薄壳
# - apps/viewer/crates/wasm/ websurf-viewer-wasm：viewer 端 wasm 薄壳（不含 websurf-phys）
#
# ── 为什么 debug/game 的 wasm 包要改名 ──────────────────────────────
# 收口前 apps/debug 与 apps/game 的 crates/wasm 同名 websurf-wasm，而 Cargo 不允许同一
# workspace 有两个同名成员 ⇒ 三端各自声明 [workspace]（4 套 Cargo.lock + 4 套 target/，
# 同一批依赖被重复编译）。改名后三端共用根 target/ 与根 Cargo.lock。pkg/ 产物文件名不受
# 包名影响：debug/game 的 package.json 用 `wasm-pack --out-name websurf_wasm` 固定为
# websurf_wasm.*，viewer 包名 websurf-viewer-wasm 的默认产物名已是 websurf_viewer_wasm.*，
# 故 copy-wasm-pkg.mjs / check:api / PKG_EXPORT_BASELINE 的契约均不变。
#
# 门禁：src/scripts/check-lock-consistency.mjs 断言 apps/*/Cargo.{toml,lock} 不得复生，
# 并用根 Cargo.lock 的依赖表校验 viewer 端不依赖 websurf-phys。
#
# ── vmdl vendor patch ──────────────────────────────────────────────
# websurf-wasm-core 依赖 vmdl 0.2，本 workspace 用 [patch.crates-io] 把它换成仓库内副本
# src/vendor/vmdl（该 manifest 自报 name = "vmdl"、version = "0.2.0"）。
# 相对 crates.io vmdl-0.2.0，副本主要修补：
# - `src/vendor/vmdl/src/vtx/mod.rs` 的 `Strip::indices`（循环边界 0..len → 0..len.saturating_sub(2)，
#   索引公式 idx+1-cw → idx+1+cw）；
# - `src/vendor/vmdl/src/lib.rs` 的 `SkinTable<'_>` / `Mesh<'_>` 生命周期标注，以及非 `STATIC_PROP`
#   模型的完整 Source Z-up 骨骼蒙皮 `idle_skin_matrices()`（`world[b] * pose_to_bone[b]`）与
#   `shared.rs` / `animation.rs` / `vvd/raw.rs` 里的 RLE 动画 `i16` 解码、Z-up 欧拉角与权重修正。

[workspace]
resolver = "2"
members = [
    "src",                        # websurf-phys：共享物理系统
    "src/wasm-core",              # websurf-wasm-core：共享 BSP/GLB/模型解析导出
    "src/wasm-bindings",          # websurf-wasm-bindings：三端共享 wasm-bindgen 导出层（P4，按 features）
    "apps/debug/crates/wasm",     # websurf-debug-wasm：debug 端 wasm 薄壳
    "apps/game/crates/wasm",      # websurf-game-wasm：game 端 wasm 薄壳
    "apps/viewer/crates/wasm",    # websurf-viewer-wasm：viewer 端 wasm 薄壳（无物理）
]

[patch.crates-io]
vmdl = { path = "src/vendor/vmdl" }
# ── lzma vendor patch ──────────────────────────────────────────────
# `zip-lzma` 的 LZMA 分支依赖 `lzma 0.2.2`，它的滑窗用 `Vec::insert` 维护 ⇒ 窗口绕回后每写
# 一字节 O(n) 搬移（O(n²)），输出超过窗口大小（VBSP 固定 16 MB）的贴图会先磨几十秒、再报
# Corrupted。仓库内副本只改 `Window::push` 一处为原地覆盖（逐字节语义不变）。
# 2026-10-24 追加无语义变化的告警清理：41 处 try!→?、error.rs 改 Display 持有文案并补
# source()、删 Probabilities 只写不读的 size 字段、Cache::new 返回类型补 '_。
lzma = { path = "src/vendor/lzma" }

# ============================================================
# 性能优化配置（对本 workspace 全部成员生效，含三端 wasm 构建；收口前是四份同值副本）
# ============================================================
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
