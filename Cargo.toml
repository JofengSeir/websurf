# WebSurf — 仓库根 Cargo workspace（共享层）
#
# 本 workspace 只收共享层 crate：websurf-phys（src/）与 websurf-wasm-core（src/wasm-core）。
#
# ── 为什么三个工程的 wasm crate 不在本 workspace ─────────────────────
# debug 与 game 的 crates/wasm 同名：apps/debug/crates/wasm/Cargo.toml 与
# apps/game/crates/wasm/Cargo.toml 的 [package] name 都是 websurf-wasm，而 Cargo
# 不允许同一 workspace 有两个同名成员。两工程的 wasm-pack 产物同为 websurf_wasm_bg.wasm，
# 被 package.json 的 build:wasm、start-dev.cmd / play.cmd / build-dist.cmd 的存在性门与
# src/scripts/wasm-stale-check.mjs 的入参引用。三个工程各自声明 [workspace]，故各自独立：
# 加上本 workspace 共四个，target/ 分别在仓库根与 apps/debug、apps/game、apps/viewer 下。
#
# ── vmdl vendor patch ──────────────────────────────────────────────
# websurf-wasm-core 依赖 vmdl 0.2，本 workspace 用 [patch.crates-io] 把它换成仓库内副本
# src/vendor/vmdl（该 manifest 自报 name = "vmdl"、version = "0.2.0"）。
# 相对 crates.io vmdl-0.2.0，副本改写了 2 个文件：
# - `src/vendor/vmdl/src/vtx/mod.rs` 的 `Strip::indices`（循环边界 0..len → 0..len.saturating_sub(2)，
#   索引公式 idx+1-cw → idx+1+cw）；
# - `src/vendor/vmdl/src/lib.rs` 的两处返回类型生命周期标注（`SkinTable<'_>` / `Mesh<'_>`）。
# [patch] 只对声明它的 workspace 生效（根这份管 websurf-wasm-core）；三个工程各自一份同款。

[workspace]
resolver = "2"
members = [
    "src",            # websurf-phys：共享物理系统
    "src/wasm-core",  # websurf-wasm-core：共享 BSP/GLB/模型解析导出
]

[patch.crates-io]
vmdl = { path = "src/vendor/vmdl" }

# ============================================================
# 性能优化配置（只对本 workspace 的构建生效；三个工程各自的 Cargo.toml 也各有一份）
# ============================================================
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
