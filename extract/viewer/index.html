<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>bsp-extract GLB Viewer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #101216; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; font-size: 13px; color: #d8dce2; }
  #app { position: fixed; inset: 0; }
  #canvas { display: block; width: 100%; height: 100%; }

  /* 顶栏 */
  #topbar {
    position: absolute; top: 12px; left: 12px; right: 12px; z-index: 10;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-radius: 10px;
    background: rgba(18, 21, 27, 0.82); border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
  }
  #topbar .title { font-size: 14px; font-weight: 600; color: #e8ecf2; margin-right: 4px; }
  #fileBtn, #demoBtn {
    font-size: 12px; color: #c8ccd4; padding: 5px 14px;
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14);
    border-radius: 7px; cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  #fileBtn:hover, #demoBtn:hover { background: rgba(255,255,255,0.14); }
  #bspBtn {
    font-size: 12px; color: #a7f3d0; padding: 5px 14px;
    background: rgba(16,185,129,0.14); border: 1px solid rgba(16,185,129,0.45);
    border-radius: 7px; cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  #bspBtn:hover { background: rgba(16,185,129,0.25); }
  #bspBtn.disabled { opacity: 0.4; cursor: wait; }
  #filename { color: #9aa3b2; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  #status { color: #5e81f4; font-size: 12px; white-space: nowrap; }

  /* HUD */
  #hud {
    position: absolute; left: 12px; bottom: 12px; z-index: 10;
    padding: 10px 14px; border-radius: 10px; line-height: 1.8;
    background: rgba(18, 21, 27, 0.82); border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(10px); pointer-events: none; user-select: none;
    font-size: 12px; color: #b6bdc9; font-variant-numeric: tabular-nums;
  }
  #hud b { color: #e8ecf2; }
  #hud .hint { color: #7d8797; font-size: 11px; }

  /* 拖放遮罩 */
  #drop {
    position: absolute; inset: 0; z-index: 20; display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.5); border: 2px dashed rgba(94,129,244,0.8);
    font-size: 18px; color: #5e81f4; pointer-events: none;
  }
  #drop.on { display: flex; }
  input[type="file"] { display: none; }
</style>
</head>
<body>
<div id="app">
  <canvas id="canvas"></canvas>
</div>

<div id="topbar">
  <span class="title">BSP / GLB Viewer</span>
  <button id="fileBtn">打开 GLB</button>
  <button id="bspBtn">打开 BSP 并解析</button>
  <button id="demoBtn">示例(surf_666)</button>
  <input type="file" id="file" accept=".glb,model/gltf-binary,.bsp,application/octet-stream" />
  <span id="filename">拖放 .glb / .bsp 到窗口(需经服务器)</span>
  <span id="status"></span>
</div>

<div id="hud">
  <div><b id="hudName">—</b></div>
  <div>顶点 <b id="hudVerts">0</b> · 三角形 <b id="hudTris">0</b> · 材质 <b id="hudMats">0</b></div>
  <div class="hint">左键旋转 · 右键平移 · 滚轮缩放 · 双击复位</div>
</div>

<div id="drop">松开以加载 GLB / BSP</div>

<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.160.0",
    "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101216);
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(1.0, 1.2, 0.6);
scene.add(sun);
const fill = new THREE.DirectionalLight(0x8899bb, 0.4);
fill.position.set(-1, 0.3, -1);
scene.add(fill);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1e7);
camera.position.set(4000, 4000, 4000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);

const loader = new GLTFLoader();
const grid = new THREE.GridHelper(4000, 40, 0x333a44, 0x22262c);
scene.add(grid);

let current = null;
function fitTo(sceneObj) {
  const box = new THREE.Box3().setFromObject(sceneObj);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const radius = Math.max(size.x, size.y, size.z) / 2 || 100;
  controls.target.copy(center);
  camera.position.copy(center).add(new THREE.Vector3(radius * 2.2, radius * 1.6, radius * 2.2));
  camera.near = radius / 1000;
  camera.far = radius * 200;
  camera.updateProjectionMatrix();
  grid.position.set(center.x, 0, center.z);
  grid.scale.set(radius / 1000, 1, radius / 1000);
}

function loadBuffer(buf, name) {
  const before = performance.now();
  setStatus('解析中…');
  loader.parse(buf, '', (gltf) => {
    const elapsed = ((performance.now() - before) / 1000).toFixed(2);
    if (current) { scene.remove(current); current = null; }
    current = gltf.scene;
    scene.add(current);
    fitTo(current);

    // 统计
    let verts = 0, tris = 0; const mats = new Set();
    current.traverse((o) => {
      if (o.isMesh) {
        const g = o.geometry;
        verts += g.attributes.position.count;
        tris += g.index ? g.index.count / 3 : g.attributes.position.count / 3;
        if (Array.isArray(o.material)) o.material.forEach(m => mats.add(m.name));
        else if (o.material) mats.add(o.material.name);
      }
    });
    document.getElementById('hudName').textContent = name;
    document.getElementById('hudVerts').textContent = verts.toLocaleString();
    document.getElementById('hudTris').textContent = Math.round(tris).toLocaleString();
    document.getElementById('hudMats').textContent = mats.size;
    document.getElementById('filename').textContent = name;
    setStatus(`✓ ${elapsed}s`);
  }, (e) => {
    setStatus('✗ 加载失败');
    console.error(e);
  });
}

function setStatus(s) { document.getElementById('status').textContent = s; }

// ---- wasm 解析层(动态加载,仅 .bsp 需要)----
let wasmReady = false;
let wasmLoading = false;
async function ensureWasm() {
  if (wasmReady) return;
  if (wasmLoading) { while (!wasmReady) await new Promise(r => setTimeout(r, 50)); return; }
  wasmLoading = true;
  setStatus('加载 wasm…');
  const btn = document.getElementById('bspBtn');
  btn.classList.add('disabled');
  try {
    const mod = await import('../pkg/bsp_extract.js');
    const wasmBytes = await (await fetch('../pkg/bsp_extract_bg.wasm')).arrayBuffer();
    const wasmModule = await WebAssembly.compile(wasmBytes);
    await mod.default({ module_or_path: wasmModule });
    window.__bsp = { toGlb: mod.bsp_to_glb, info: mod.bsp_info };
    wasmReady = true;
    setStatus('wasm ✓');
  } catch (e) {
    setStatus('✗ wasm 加载失败');
    console.error(e);
  } finally {
    btn.classList.remove('disabled');
    wasmLoading = false;
  }
}

// ---- 主加载入口:按扩展名分流 ----
function loadFile(buf, name) {
  const lower = name.toLowerCase();
  if (lower.endsWith('.bsp')) {
    loadBsp(buf, name);
  } else {
    loadBuffer(buf, name);
  }
}

async function loadBsp(buf, name) {
  const before = performance.now();
  setStatus('wasm 解析 BSP…');
  try {
    await ensureWasm();
    if (!wasmReady) return;
    const glbBytes = window.__bsp.toGlb(new Uint8Array(buf));
    setStatus('几何生成,构建场景…');
    // 复用 GLB 渲染链路
    loadBuffer(glbBytes.buffer.slice(glbBytes.byteOffset, glbBytes.byteOffset + glbBytes.byteLength), name);
    const elapsed = ((performance.now() - before) / 1000).toFixed(2);
    setStatus(`✓ BSP 解析 ${elapsed}s`);
  } catch (e) {
    setStatus('✗ BSP 解析失败');
    console.error(e);
  }
}

// 文件选择
document.getElementById('fileBtn').addEventListener('click', () => {
  const input = document.getElementById('file');
  input.accept = '.glb,model/gltf-binary';
  input.click();
});
document.getElementById('bspBtn').addEventListener('click', () => {
  const input = document.getElementById('file');
  input.accept = '.bsp';
  input.click();
});
document.getElementById('file').addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (f) f.arrayBuffer().then(b => loadFile(b, f.name));
});

// 拖放
const drop = document.getElementById('drop');
window.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('on'); });
window.addEventListener('dragleave', (e) => { e.preventDefault(); drop.classList.remove('on'); });
window.addEventListener('drop', (e) => {
  e.preventDefault();
  drop.classList.remove('on');
  const f = e.dataTransfer.files[0];
  if (f) f.arrayBuffer().then(b => loadFile(b, f.name));
});

// 双击复位
canvas.addEventListener('dblclick', () => { if (current) fitTo(current); });

// 示例加载:surf_666.bsp(经 wasm 解析;经服务器,根路径 /maps/)
document.getElementById('demoBtn').addEventListener('click', async () => {
  try {
    const r = await fetch('/maps/surf_666.bsp');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const b = await r.arrayBuffer();
    loadBsp(b, 'surf_666.bsp');
  } catch (e) {
    setStatus('✗ 示例加载失败(需经服务器)');
  }
});

// URL ?file= 参数直接加载
const params = new URLSearchParams(location.search);
const qfile = params.get('file');
if (qfile) {
  fetch(qfile).then(r => r.arrayBuffer()).then(b => loadFile(b, qfile.split('/').pop()))
    .catch(() => setStatus('✗ 加载失败(检查路径)'));
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
